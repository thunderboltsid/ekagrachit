name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. v0.1.1). Empty: build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # The tag being released: the pushed tag, or the one given to a manual run.
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run for a tag builds exactly that tag's source.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version from the tag
        if: env.TAG != ''
        run: |
          # The tag is the source of truth: stamp its version into the manifest,
          # app bundle and host so they can never disagree with the release.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }
          scripts/set-version.sh "${TAG#v}"
      - name: Test core
        working-directory: apps/macos
        run: swift test
      - name: Build release artifacts
        run: scripts/package-release.sh
      - name: Verify the DMG mounts and contains a valid app
        run: |
          DMG=$(ls dist/*.dmg)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')
          codesign --verify --strict "$MNT/Ekagrachit.app"
          test -f "$MNT/Ekagrachit.app/Contents/Resources/AppIcon.icns"
          test -f "$MNT/Ekagrachit.app/Contents/Resources/ChromeExtension/manifest.json"
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # A release may already exist (created by hand in the GitHub UI): attach
          # the artifacts to it instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* \
              --title "Ekagrachit ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

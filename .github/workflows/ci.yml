name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Chrome extension (unit + Chromium E2E)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/chrome/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build native host (for the full-chain bridge test)
        working-directory: apps/macos
        run: swift build --product ekagrachit-host
      - run: npx playwright install --with-deps chromium
      - name: E2E (headed under Xvfb so window focus is real)
        run: HEADED=1 xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: ekagrachit-chrome-extension
          path: extensions/chrome/dist

  core-linux:
    name: Swift core + host (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  macos:
    name: macOS app (build, test, bundle)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extension
        working-directory: extensions/chrome
        run: npm ci && npm run build
      - name: Test core
        working-directory: apps/macos
        run: swift build && swift test
      - name: Build app bundle (arm64, ad-hoc signed)
        run: scripts/build-app.sh
      - name: Smoke-test bundle
        run: |
          APP=apps/macos/build/Ekagrachit.app
          lipo -info "$APP/Contents/MacOS/Ekagrachit"
          lipo -info "$APP/Contents/MacOS/ekagrachit-host"
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/ChromeExtension/manifest.json"
          # The host must exit cleanly when Chrome closes stdin.
          EKAGRACHIT_SOCKET=/tmp/ek-ci.sock "$APP/Contents/MacOS/ekagrachit-host" chrome-extension://x/ </dev/null
      - name: Build desktop test probe
        working-directory: apps/macos
        run: swift build -c release --product ekagrachit-probe
      - name: Launch the real app and drive it through the real host
        env:
          EK_ARTIFACTS: ${{ github.workspace }}/desktop-artifacts
        run: mkdir -p desktop-artifacts && node scripts/ci-macos-smoke.mjs apps/macos/build/Ekagrachit.app
      - name: Runner capabilities (SIP, TCC, Accessibility)
        run: |
          csrutil status || true
          PROBE=apps/macos/.build/release/ekagrachit-probe
          APPBIN="$PWD/apps/macos/build/Ekagrachit.app/Contents/MacOS/Ekagrachit"
          NOW=$(date +%s)
          # Try to grant Accessibility to the app and the probe (works only where the
          # system TCC database is writable, e.g. SIP disabled on CI images).
          for client in "$APPBIN" "$PWD/$PROBE" "/usr/local/bin/node" "$(command -v node)"; do
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW,NULL,NULL,'UNUSED',$NOW);" \
              && echo "granted AX to $client" || echo "could not grant AX to $client"
          done
          "$PROBE" env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop E2E (real app + real Chromium + extension + host)
        working-directory: extensions/chrome
        env:
          HEADED: '1'
          EK_APP: ${{ github.workspace }}/apps/macos/build/Ekagrachit.app
          EK_PROBE: ${{ github.workspace }}/apps/macos/.build/release/ekagrachit-probe
          EK_ARTIFACTS: ${{ github.workspace }}/desktop-artifacts
        run: |
          npx playwright install chromium
          npm run test:macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-screenshots
          path: desktop-artifacts
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent apps/macos/build/Ekagrachit.app dist/Ekagrachit-macOS-unsigned.zip
          (cd extensions/chrome && zip -qr ../../dist/ekagrachit-chrome-extension.zip dist)
          cp scripts/install.sh scripts/uninstall.sh scripts/doctor.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ekagrachit-macos-unsigned
          path: dist


  # Every green push to main ships: the next version is tagged and released
  # (see release.yml). Pull requests and other branches only run the checks.
  publish:
    name: Release (automatic on main)
    needs: [extension, core-linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit # UPDATE_SIGNING_KEY: signs automatic updates
